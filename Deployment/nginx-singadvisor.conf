# nginx config for the SingAdvisor SPA (Frontend-vite build output).
# Drop into /etc/nginx/sites-available/singadvisor, symlink to
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Two origins are served:
#   1. This server block — the SPA static files with history-mode fallback
#      (React Router deep links like /events/nexus must return index.html).
#   2. The Backend — either on its own subdomain/port (simplest) with
#      VITE_API_URL pointed at it, OR proxied below at /api (then set
#      VITE_API_URL=https://<domain>/api in Frontend-vite/.env.production
#      and uncomment the /api location). Choose ONE.

# ---------------------------------------------------------------------------
# Link previews (WhatsApp / LinkedIn / Facebook / Slack / X / Telegram …)
#
# This is a client-rendered SPA: its per-page <meta> tags are written by
# react-helmet-async AFTER the JavaScript runs, and no social crawler runs
# JavaScript. Every shared link therefore showed the single static card in
# index.html — no cover image — whatever article it pointed at.
#
# So: crawlers (and only crawlers) are routed to the Backend's /share/*
# renderer, which returns a tiny HTML document carrying that post's or
# issue's real Open Graph tags, cover image included. A human's request is
# untouched and still gets the SPA.
#
# This `map` must sit at http{} level — i.e. in nginx.conf, or at the top of
# this file if it is included from http{} (the default for sites-enabled).
# It cannot go inside the server block below.
# ---------------------------------------------------------------------------
map $http_user_agent $singadvisor_social_crawler {
    default 0;
    "~*(facebookexternalhit|Facebot|WhatsApp|LinkedInBot|Twitterbot|Slackbot|Slack-ImgProxy|TelegramBot|Discordbot|Pinterest|redditbot|SkypeUriPreview|vkShare|Applebot|embedly|Iframely|quora link preview|outbrain|nuzzel|XING-contenttabreceiver|Mastodon|Bluesky|bitlybot|Viber|Line)" 1;
}

server {
    listen 80;
    server_name singadvisor.com www.singadvisor.com;

    root /home/singadvisor/singadvisor/Frontend-vite/dist;
    index index.html;

    # Gzip the static build
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Blog posts and newsletter issues — the two routes whose share cards
    # carry a cover image. A regex location is matched before the prefix
    # `location /` below, so these win; everything else falls through
    # unchanged. Readers get index.html exactly as before; only a crawler
    # user-agent is re-dispatched to the /__og/ block.
    location ~ ^/(blog|newsletter)/[^/]+/?$ {
        if ($singadvisor_social_crawler) {
            rewrite ^/(blog|newsletter)/([^/]+)/?$ /__og/$1/$2 last;
        }
        try_files $uri /index.html;
    }

    # Internal only: reachable through the rewrite above, never from outside.
    # The port MUST match PORT in Backend/.env and the /api block below —
    # 4001 on this server, where another app already holds 4000. Point this
    # at the wrong port and crawlers silently fall back to the generic card.
    location ^~ /__og/ {
        internal;
        proxy_pass http://127.0.0.1:4001/share/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A crawler that waits gets no preview at all — fail fast back to the
        # SPA shell rather than hanging on a slow database read.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 /index.html;
    }

    # Static files copied from public/ (images, videos, sitemap, robots)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }

    # Option A (recommended to start): run the Backend on its own origin
    # (e.g. api.singadvisor.com) and set VITE_API_URL accordingly — then
    # this /api block stays commented out.
    #
    # Option B: same-origin proxy — uncomment this and set
    # VITE_API_URL=https://singadvisor.com/api. Note the Backend's routes
    # have no /api prefix, so the path is stripped here.
    #
    # location /api/ {
    #     # 4001 matches PORT in Backend/.env on shared servers where 4000
    #     # is already taken by an existing app.
    #     proxy_pass http://127.0.0.1:4001/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 50m; # uploads (résumés up to 5MB, images up to 50MB)
    # }
}
